# Configuration optimized for Windows Laptop with NVIDIA RTX 3050 / 4050 (4GB-6GB VRAM)
system:
  project_name: "ChemRxn-Intelligence"
  version: "0.1.0"
  seed: 42
  deterministic: true
  log_level: "INFO"
  log_file: "logs/rtx_laptop.log"

hardware:
  device: "auto"          # CUDA if available, CPU fallback
  cuda_device_id: 0
  mixed_precision: true   # fp16 via torch.cuda.amp is critical for 4GB/6GB VRAM
  cudnn_benchmark: false
  pin_memory: true
  num_workers: 0          # Windows multiprocessing safety: prevents spawned process VRAM duplication
  empty_cache_frequency: 100 # call torch.cuda.empty_cache() periodically

data:
  raw_dir: "ReactionSeq2Seq_Dataset"
  processed_dir: "data/processed"
  train_file: "ReactionSeq2Seq_Dataset/US_patents_1976-Sep2016_1product_reactions_train.csv"
  valid_file: "ReactionSeq2Seq_Dataset/US_patents_1976-Sep2016_1product_reactions_valid.csv"
  test_file: "ReactionSeq2Seq_Dataset/US_patents_1976-Sep2016_1product_reactions_test.csv"
  jin_train_file: "ReactionSeq2Seq_Dataset/Jin_USPTO_1product_train.txt"
  jin_valid_file: "ReactionSeq2Seq_Dataset/Jin_USPTO_1product_valid.txt"
  jin_test_file: "ReactionSeq2Seq_Dataset/Jin_USPTO_1product_test.txt"
  max_sequence_length: 128 # Compact length keeps attention matrix within VRAM
  vocab_file: "data/processed/smiles_vocab.json"
  sample_size_limit: 50000 # Configurable limit for laptop prototyping; null for full 900k
  chunk_size: 5000         # Efficient batch iteration for large files without high RAM pressure

chemistry:
  fingerprint_type: "morgan"
  fingerprint_radius: 2
  fingerprint_nbits: 2048
  canonicalize: true
  remove_atom_mapping: true

model:
  type: "transformer"
  d_model: 256
  nhead: 8
  num_encoder_layers: 3   # 3 encoder / 3 decoder layers fit comfortably in RTX 3050/4050 VRAM
  num_decoder_layers: 3
  dim_feedforward: 512
  dropout: 0.1
  init_method: "xavier_uniform"

training:
  batch_size: 32           # Fits easily within 4GB-6GB VRAM
  gradient_accumulation_steps: 4 # Effective batch size 128 (32 * 4)
  learning_rate: 0.0003
  weight_decay: 0.0001
  max_epochs: 15
  warmup_steps: 500
  patience: 3
  checkpoint_dir: "checkpoints/rtx_laptop"
  save_top_k: 2

api:
  host: "127.0.0.1"
  port: 8001
  reload: false
